name: Collegial macOS timeout diagnosis
on:
  push:
    branches: [samad/collegial-macos-diagnosis]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Reproduce wrapper timeout and retain traceback
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess, sys
          code = Path('bin/coding-agent').read_text().split("<<'PY_DEADLINE'\n", 1)[1].split('\nPY_DEADLINE', 1)[0]
          print(sys.version, flush=True)
          result = subprocess.run([sys.executable, '-c', code, '1', 'sleep', '5'])
          print('Wrapper timeout exit:', result.returncode, flush=True)
          sys.exit(0 if result.returncode == 124 else 1)
          PYTHON
